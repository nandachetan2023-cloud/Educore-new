<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="EduCore — white-label learning platform. Feature overview poster.">
  <title>EduCore — White-Label LMS &amp; Course Marketplace</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="140" cy="130" r="360" fill="url(#glow1)"/>
  <circle cx="980" cy="1180" r="400" fill="url(#glow2)"/>

  <!-- Decorative arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2">
    <circle cx="940" cy="150" r="200"/>
    <circle cx="940" cy="150" r="280"/>
    <circle cx="940" cy="150" r="360"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.05">
    <circle cx="90" cy="1230" r="150"/>
  </g>

  <!-- Eyebrow pill -->
  <g>
    <rect x="72" y="78" width="380" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <circle cx="96" cy="98" r="5" fill="#4ADE80"/>
    <text x="114" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#FFFFFF">WHITE-LABEL LMS PLATFORM</text>
  </g>

  <!-- Headline -->
  <text x="72" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#FFFFFF">EduCore</text>
  <rect x="72" y="252" width="150" height="6" rx="3" fill="url(#accent)"/>

  <text x="72" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Learn without limits.</text>
  <text x="72" y="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#FFFFFF" fill-opacity="0.82">Launch and run a course business under your own brand —</text>
  <text x="72" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#FFFFFF" fill-opacity="0.82">no per-seat fees, no white-labeling charges.</text>

  <!-- Feature cards -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Row 1 -->
    <g transform="translate(72,462)">
      <rect width="452" height="164" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="58" cy="52" r="24" fill="url(#accent)" fill-opacity="0.9"/>
      <g fill="none" stroke="#1E1B4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 44h13a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H50"/>
        <path d="M50 44v19"/>
        <path d="M46 44h9a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3V47a3 3 0 0 1 3-3z"/>
      </g>
      <text x="94" y="49" font-size="21" font-weight="700" fill="#FFFFFF">Course marketplace</text>
      <text x="94" y="73" font-size="16" fill="#FFFFFF" fill-opacity="0.78">Catalogue, search, categories</text>
      <text x="94" y="95" font-size="16" fill="#FFFFFF" fill-opacity="0.78">and full curriculum pages</text>
    </g>

    <g transform="translate(556,462)">
      <rect width="452" height="164" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="58" cy="52" r="24" fill="url(#accent)" fill-opacity="0.9"/>
      <path d="M52 41l16 11-16 11z" fill="#1E1B4B"/>
      <text x="94" y="49" font-size="21" font-weight="700" fill="#FFFFFF">Built-in course player</text>
      <text x="94" y="73" font-size="16" fill="#FFFFFF" fill-opacity="0.78">Video, YouTube and Vimeo with</text>
      <text x="94" y="95" font-size="16" fill="#FFFFFF" fill-opacity="0.78">auto progress tracking</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(72,658)">
      <rect width="452" height="164" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="58" cy="52" r="24" fill="url(#accent)" fill-opacity="0.9"/>
      <g fill="none" stroke="#1E1B4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="58" cy="46" r="9"/>
        <path d="M52 53l-4 12 10-5 10 5-4-12"/>
      </g>
      <text x="94" y="49" font-size="21" font-weight="700" fill="#FFFFFF">PDF certificates</text>
      <text x="94" y="73" font-size="16" fill="#FFFFFF" fill-opacity="0.78">Awarded automatically at 100%</text>
      <text x="94" y="95" font-size="16" fill="#FFFFFF" fill-opacity="0.78">completion, downloadable</text>
    </g>

    <g transform="translate(556,658)">
      <rect width="452" height="164" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="58" cy="52" r="24" fill="url(#accent)" fill-opacity="0.9"/>
      <g fill="none" stroke="#1E1B4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="46" y="42" width="24" height="18" rx="3"/>
        <path d="M46 49h24"/>
        <path d="M50 55h6"/>
      </g>
      <text x="94" y="49" font-size="21" font-weight="700" fill="#FFFFFF">3 payment gateways</text>
      <text x="94" y="73" font-size="16" fill="#FFFFFF" fill-opacity="0.78">Stripe, PayPal and Razorpay —</text>
      <text x="94" y="95" font-size="16" fill="#FFFFFF" fill-opacity="0.78">cards, netbanking, UPI</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(72,854)">
      <rect width="452" height="164" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="58" cy="52" r="24" fill="url(#accent)" fill-opacity="0.9"/>
      <g fill="none" stroke="#1E1B4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M44 60V44l14-9 14 9v16l-14 9z"/>
        <path d="M44 44l14 9 14-9"/>
      </g>
      <text x="94" y="49" font-size="21" font-weight="700" fill="#FFFFFF">Rebrand in one click</text>
      <text x="94" y="73" font-size="16" fill="#FFFFFF" fill-opacity="0.78">Name, logo, colours, currency</text>
      <text x="94" y="95" font-size="16" fill="#FFFFFF" fill-opacity="0.78">and domains — no redeploy</text>
    </g>

    <g transform="translate(556,854)">
      <rect width="452" height="164" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="58" cy="52" r="24" fill="url(#accent)" fill-opacity="0.9"/>
      <g fill="none" stroke="#1E1B4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M47 60V50"/>
        <path d="M55 60V43"/>
        <path d="M63 60V54"/>
      </g>
      <text x="94" y="49" font-size="21" font-weight="700" fill="#FFFFFF">Coupons &amp; flash sales</text>
      <text x="94" y="73" font-size="16" fill="#FFFFFF" fill-opacity="0.78">Codes, spend caps and offers</text>
      <text x="94" y="95" font-size="16" fill="#FFFFFF" fill-opacity="0.78">that discount automatically</text>
    </g>
  </g>

  <!-- Bottom CTA band -->
  <g transform="translate(72,1068)">
    <rect width="936" height="126" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <text x="468" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Everything included — self-host it yourself</text>
    <text x="468" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.80">Instructor payouts  ·  Blog &amp; CMS  ·  Role-based security  ·  Multi-workspace</text>
  </g>

  <!-- Footer -->
  <text x="72" y="1262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" fill-opacity="0.70">educore.app</text>
  <text x="1008" y="1262" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.70">Your brand. Your domain.</text>

  <rect x="0" y="1340" width="1080" height="10" fill="url(#accent)"/>
</svg>